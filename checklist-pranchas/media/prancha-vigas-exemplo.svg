  <text x="140" y="176" fill="#E00024" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">V1</text>
  <text x="140" y="316" fill="#E00024" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">V2</text>
  <rect x="520" y="150" width="390" height="280" fill="#f5f5f5" stroke="#222222"/>
  <text x="540" y="180" fill="#222222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="16" font-weight="700">Tabela de treino</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#222222">
    <text x="540" y="220" font-weight="700">Código</text>
    <text x="660" y="220" font-weight="700">Onde aparece</text>
    <text x="540" y="258">V1</text>
    <text x="660" y="258">Entre A e B, eixo 1</text>
    <text x="540" y="296">V2</text>
    <text x="660" y="296">Entre A e B, eixo 2</text>
    <text x="540" y="360" fill="#5c5c5c">Confira se cada codigo da tabela</text>
    <text x="540" y="382" fill="#5c5c5c">também está na planta ao lado.</text>
  </g>
  <rect x="520" y="460" width="390" height="120" fill="#ffffff" stroke="#222222"/>
  <text x="540" y="490" fill="#222222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">Carimbo de exemplo</text>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" fill="#222222">
    <text x="540" y="518">Projeto: Edificio exemplo</text>
    <text x="540" y="540">Folha: VIG-01 - Revisão: R00</text>
    <text x="540" y="562">Conteúdo editável no checklist. Sem assinatura digital.</text>
