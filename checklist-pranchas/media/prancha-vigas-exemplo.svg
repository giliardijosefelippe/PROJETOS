<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img">
  <rect width="960" height="640" fill="#ffffff"/>
  <rect x="12" y="12" width="936" height="616" fill="none" stroke="#222222" stroke-width="3"/>
  <rect x="24" y="24" width="912" height="592" fill="none" stroke="#222222" stroke-width="1"/>
  <text x="40" y="58" fill="#E00024" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="700">MODELO DIDÁTICO — PRANCHA DE EXEMPLO</text>
  <text x="40" y="86" fill="#222222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="700">Vigas - folha de treino</text>
  <text x="40" y="112" fill="#5c5c5c" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">Não é projeto real. Não traz bitola, espaçamento nem texto de norma.</text>
  <g stroke="#222222" fill="none" stroke-width="1.25">
    <line x1="70" y1="150" x2="70" y2="430"/>
    <line x1="250" y1="150" x2="250" y2="430"/>
    <line x1="430" y1="150" x2="430" y2="430"/>
    <line x1="50" y1="190" x2="470" y2="190"/>
    <line x1="50" y1="330" x2="470" y2="330"/>
  </g>
  <g fill="#222222" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700">
    <text x="64" y="144">A</text>
    <text x="244" y="144">B</text>
    <text x="424" y="144">C</text>
  </g>
  <rect x="58" y="178" width="24" height="24" fill="#222222"/>
  <rect x="238" y="178" width="24" height="24" fill="#222222"/>
  <rect x="58" y="318" width="24" height="24" fill="#222222"/>
  <rect x="238" y="318" width="24" height="24" fill="#222222"/>
  <rect x="82" y="184" width="156" height="12" fill="#E00024"/>
