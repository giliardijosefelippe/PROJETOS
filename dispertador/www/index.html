<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f766e" />
    <meta name="description" content="Dispertador: lembrete de medicamentos com alarme tipo despertador." />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/icon-192.png" />
    <link rel="stylesheet" href="css/app.css" />
    <title>Dispertador</title>
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <img src="icons/icon.svg" alt="" width="32" height="32" />
        <span>Dispertador</span>
      </div>
      <div class="clock" id="clock" aria-live="off"></div>
    </header>

    <main id="view" tabindex="-1"></main>

    <nav class="tabs" aria-label="Navegação principal">
      <button data-tab="hoje" class="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8v5l3 2M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z"/></svg>
        Hoje
      </button>
      <button data-tab="remedios" class="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m10.5 20.5-7-7a4.95 4.95 0 0 1 7-7l7 7a4.95 4.95 0 0 1-7 7ZM8.5 8.5l7 7"/></svg>
        Remédios
      </button>
      <button data-tab="historico" class="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5h16M4 12h16M4 19h10"/></svg>
        Histórico
      </button>
      <button data-tab="ajustes" class="tab">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6Zm7.4-2a7.5 7.5 0 0 0 0-2l2-1.5-2-3.4-2.3.9a7.5 7.5 0 0 0-1.7-1L15 3h-4l-.4 2.5a7.5 7.5 0 0 0-1.7 1l-2.3-.9-2 3.4 2 1.5a7.5 7.5 0 0 0 0 2l-2 1.5 2 3.4 2.3-.9c.5.4 1.1.7 1.7 1L11 21h4l.4-2.5c.6-.3 1.2-.6 1.7-1l2.3.9 2-3.4-2-1.5Z"/></svg>
        Ajustes
      </button>
    </nav>

    <dialog id="modal" class="modal"></dialog>

    <section id="ring" class="ring" hidden role="alertdialog" aria-modal="true" aria-label="Alarme de medicamento"></section>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
