<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1f24" />
  <meta name="description" content="Conferência de armadura in loco — marcar PDF, relatório OK/risco." />
  <title>Conf. Armadura</title>
  <style>
    :root {
      --bg: #12161a;
      --surface: #1a1f24;
      --surface-2: #242b33;
      --border: #3a4550;
      --text: #f2f4f6;
      --muted: #a8b2bc;
      --accent: #e00024;
      --ok: #1f9d55;
      --risk: #e8a317;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --safe-top: env(safe-area-inset-top, 0px);
      --top-h: 56px;
      --touch: 48px;
      --dock-size: 52px;
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      margin: 0; height: 100%; background: var(--bg); color: var(--text);
      overflow: hidden; touch-action: none;
    }
    #app {
      display: grid;
      grid-template-rows: calc(var(--top-h) + var(--safe-top)) 1fr;
      height: 100%; height: 100dvh;
    }
    .top-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: calc(8px + var(--safe-top)) 10px 8px;
      background: linear-gradient(180deg, #1c232b 0%, #151a1f 100%);
      border-bottom: 1px solid var(--border); z-index: 5;
      min-height: calc(var(--top-h) + var(--safe-top));
      box-sizing: border-box;
    }
    .brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
    .brand-mark {
      width: 28px; height: 28px; border-radius: 6px; flex-shrink: 0;
      background: linear-gradient(135deg, var(--accent), #8a0016);
    }
    .brand-text { display: flex; flex-direction: column; min-width: 0; }
    .brand-text strong { font-size: 15px; line-height: 1.1; }
    .brand-text span {
      font-size: 11px; color: var(--muted); white-space: nowrap;
      overflow: hidden; text-overflow: ellipsis; max-width: 48vw;
    }
    .brand-text .rev-label { font-size: 10px; color: #8fa0ae; max-width: none; }
    .top-actions {
      display: flex; align-items: center; gap: 6px; flex-shrink: 0;
    }
    .icon-btn, .tool, .dock-btn, .primary, .secondary {
      border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
      font-weight: 700; cursor: pointer;
    }
    .icon-btn {
      width: var(--touch); height: var(--touch); border-radius: 12px; font-size: 22px;
    }
    .stage {
      position: relative; overflow: hidden;
      background:
        radial-gradient(circle at 20% 10%, rgba(224, 0, 36, 0.08), transparent 40%),
        linear-gradient(180deg, #0e1216, #171c22 55%, #101418);
    }
    .viewport { width: 100%; height: 100%; overflow: hidden; position: relative; touch-action: none; }
    .scene { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; contain: layout style; }
    #pdf-canvas, #anno-canvas, #detail-canvas { position: absolute; left: 0; top: 0; display: block; }
    #pdf-canvas { z-index: 1; }
    #detail-canvas { z-index: 1; pointer-events: none; display: none; image-rendering: auto; }
    #anno-canvas { z-index: 2; }
    /* Lightweight selection preview — CSS only during drag (no canvas/pdf.js on pointermove). */
    #select-preview {
      position: absolute; left: 0; top: 0; z-index: 3;
      width: 0; height: 0; pointer-events: none;
      border: 2px dashed #e00024;
      box-sizing: border-box;
      will-change: transform, width, height;
      transform: translate3d(0, 0, 0);
      display: none;
    }
    #select-preview.on { display: block; }
    #select-preview.ok { border-color: #1f9d55; background: rgba(31, 157, 85, 0.08); }
    #select-preview.risk { border-color: #e00024; background: rgba(224, 0, 36, 0.07); }
    .hint {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      background: rgba(18, 22, 26, 0.85); border: 1px solid var(--border);
      padding: 12px 16px; border-radius: 10px; color: var(--muted);
      font-size: 14px; pointer-events: none; z-index: 3; max-width: 80vw; text-align: center;
    }
    .hint[hidden] { display: none !important; }

    /* Floating icon dock */
    #tool-dock {
      position: fixed;
      z-index: 35;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: calc(var(--dock-size) + 10px);
      max-height: calc(100dvh - 24px - var(--safe-bottom) - var(--safe-top));
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 6px;
      border-radius: 16px;
      background: rgba(21, 26, 31, 0.94);
      border: 1px solid var(--border);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
      touch-action: none;
      user-select: none;
    }
    #tool-dock.collapsed {
      width: var(--dock-size);
      padding: 6px;
      gap: 0;
    }
    #tool-dock.collapsed .dock-body { display: none; }
    .dock-handle {
      display: flex; align-items: center; justify-content: center; gap: 4px;
      min-height: 28px; border-radius: 10px; color: var(--muted);
      font-size: 14px; letter-spacing: 0.12em; cursor: grab;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid transparent;
    }
    #tool-dock.collapsed .dock-handle {
      min-height: var(--dock-size);
      width: 100%;
      border-color: var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 18px;
      cursor: pointer;
    }
    .dock-handle:active { cursor: grabbing; }
    .dock-body {
      display: flex; flex-direction: column; gap: 6px;
      overflow-y: auto; overflow-x: hidden;
      scrollbar-width: thin;
      -webkit-overflow-scrolling: touch;
      padding-bottom: 2px;
    }
    .dock-sep {
      height: 1px; margin: 2px 6px; background: var(--border); flex: 0 0 auto;
    }
    .dock-btn, .tool.dock-btn, label.dock-btn {
      width: 100%;
      min-width: var(--dock-size);
      min-height: var(--dock-size);
      margin: 0;
      padding: 0;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      line-height: 1;
      flex: 0 0 auto;
    }
    label.dock-btn { cursor: pointer; }
    .tool[aria-pressed="true"] {
      background: #2c3640; border-color: #7f93a8;
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.08);
    }
    .tool[data-tool="ok"][aria-pressed="true"] { background: #184a2d; border-color: var(--ok); }
    .tool[data-tool="risk"][aria-pressed="true"] { background: #4a1818; border-color: #ff4d4d; }
    .tool-icon { font-size: 20px; line-height: 1; }
    .tool-icon.ok { color: #7ddea8; }
    .tool-icon.risk { color: #ff6b6b; font-weight: 900; }
    .dock-btn.accent { background: var(--accent); border-color: #ff3b57; color: #fff; }
    .dock-btn.danger { color: #ffc9c9; border-color: #7a3030; }
    .autosave-chip {
      position: fixed; right: 12px; bottom: calc(12px + var(--safe-bottom));
      z-index: 30; font-size: 11px; color: var(--muted);
      background: rgba(18, 22, 26, 0.82); border: 1px solid var(--border);
      border-radius: 999px; padding: 6px 10px; pointer-events: none;
      opacity: 0; transition: opacity 0.25s ease;
    }
    .autosave-chip.on { opacity: 1; }
    .report-panel, .library-panel {
      position: fixed; left: 0; right: 0; bottom: 0; max-height: min(72vh, 640px);
      background: var(--surface); border-top: 1px solid var(--border); z-index: 40;
      display: flex; flex-direction: column; padding-bottom: var(--safe-bottom);
      box-shadow: 0 -12px 40px rgba(0, 0, 0, 0.45);
    }
    .report-panel[hidden], .library-panel[hidden] { display: none !important; }
    .library-panel .lib-item {
      display: flex; gap: 10px; align-items: flex-start; justify-content: space-between;
      padding: 10px 0; border-bottom: 1px solid var(--border);
    }
    .library-panel .lib-item button {
      min-height: 40px; padding: 0 12px; border-radius: 10px;
      border: 1px solid var(--border); background: var(--surface-2); color: var(--text);
      font-weight: 700; cursor: pointer;
    }
    .library-panel .lib-meta { min-width: 0; flex: 1; }
    .library-panel .lib-meta strong {
      display: block; font-size: 14px; word-break: break-word;
    }
    .library-panel .lib-meta span { color: var(--muted); font-size: 12px; }
    .library-panel .lib-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .report-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; border-bottom: 1px solid var(--border);
    }
    .report-head h2 { margin: 0; font-size: 18px; }
    .report-body {
      overflow: auto; padding: 12px 14px 8px; font-size: 14px;
      line-height: 1.45; min-height: 140px; flex: 1;
    }
    .report-body .summary {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 14px;
    }
    .report-body .stat {
      background: var(--surface-2); border: 1px solid var(--border);
      border-radius: 10px; padding: 10px; text-align: center;
    }
    .report-body .stat strong { display: block; font-size: 22px; }
    .report-body .stat span { color: var(--muted); font-size: 12px; }
    .report-body .stat.ok strong { color: #7ddea8; }
    .report-body .stat.risk strong { color: #ffcc66; }
    .report-body h4 {
      margin: 12px 0 6px; font-size: 13px; color: var(--muted); font-weight: 700;
      letter-spacing: 0.02em;
    }
    .report-body h4:first-child { margin-top: 4px; }
    .report-body .group-empty { color: var(--muted); font-size: 13px; margin: 0 0 8px; }
    .report-body h3 {
      margin: 12px 0 6px; font-size: 13px; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--muted);
    }
    .report-body ul { margin: 0; padding-left: 18px; }
    .report-body li { margin-bottom: 6px; }
    .report-actions { display: flex; gap: 8px; padding: 10px 14px 14px; }
    .primary, .secondary {
      min-height: 44px; border-radius: 10px; padding: 0 14px; font-size: 14px;
    }
    .primary { background: var(--accent); border-color: #ff3b57; color: #fff; flex: 1; }
    .primary.danger { background: #a01828; border-color: #ff4d4d; }
    .modal-card p { margin: 0 0 4px; color: var(--muted); font-size: 14px; line-height: 1.4; }
    .modal {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.55);
      display: grid; place-items: end center; z-index: 50; padding: 16px;
    }
    .modal[hidden] { display: none !important; }
    .modal-card {
      width: min(480px, 100%); background: var(--surface); border: 1px solid var(--border);
      border-radius: 14px; padding: 14px; margin-bottom: calc(24px + var(--safe-bottom));
    }
    .modal-card h3 { margin: 0 0 10px; font-size: 16px; }
    .modal-card textarea {
      width: 100%; border-radius: 10px; border: 1px solid var(--border);
      background: #0f1317; color: var(--text); padding: 12px; font-size: 16px; resize: vertical;
    }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }

    /* Immersive / fullscreen — slim bar keeps only ☰ */
    html.app-fullscreen #app {
      grid-template-rows: calc(var(--touch) + var(--safe-top) + 8px) 1fr;
    }
    html.app-fullscreen .top-bar {
      justify-content: flex-end;
      background: transparent;
      border-bottom: none;
      padding: calc(4px + var(--safe-top)) 8px 4px;
      min-height: 0;
      pointer-events: none;
    }
    html.app-fullscreen .top-bar .brand { display: none; }
    html.app-fullscreen .top-bar .top-actions { pointer-events: auto; }
    html.app-fullscreen .stage {
      min-height: 100dvh;
    }
    html.app-fullscreen #tool-dock {
      z-index: 10050;
      max-height: calc(100dvh - 16px - var(--safe-bottom) - var(--safe-top));
    }
    html.app-fullscreen .report-panel,
    html.app-fullscreen .library-panel {
      z-index: 10060;
    }
    html.app-fullscreen .modal {
      z-index: 10070;
    }
    html.app-fullscreen .autosave-chip {
      z-index: 10040;
    }
    html.app-fullscreen #hint {
      z-index: 10045;
    }
    #tool-dock .dock-btn.fs-on {
      color: #102016; background: #7ddea8; border-color: #4caf78;
    }

    /* ☰ lives inside the top bar (right) — not a free-floating button */
    .side-toggle {
      width: var(--touch);
      height: var(--touch);
      min-width: var(--touch);
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 22px;
      font-weight: 700;
      line-height: 1;
      cursor: pointer;
      padding: 0;
      display: grid;
      place-items: center;
    }
    .side-toggle[aria-expanded="true"] {
      background: var(--accent);
      border-color: #ff3b57;
      color: #fff;
    }
    .side-panel {
      position: fixed;
      top: calc(var(--top-h) + var(--safe-top) + 6px);
      right: max(8px, env(safe-area-inset-right, 0px));
      z-index: 45;
      width: min(260px, calc(100vw - 24px));
      max-height: calc(100dvh - var(--top-h) - var(--safe-top) - var(--safe-bottom) - 20px);
      overflow: auto;
      border-radius: 16px;
      border: 1px solid var(--border);
      background: rgba(21, 26, 31, 0.97);
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.5);
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .side-panel[hidden] { display: none !important; }
    html.app-fullscreen .side-panel {
      top: calc(var(--touch) + var(--safe-top) + 12px);
      z-index: 10055;
    }
    .side-item, label.side-item {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 44px;
      width: 100%;
      padding: 0 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      text-align: left;
      box-sizing: border-box;
    }
    .side-item .side-ico { width: 1.25em; text-align: center; flex-shrink: 0; }
    .side-item.accent {
      background: var(--accent);
      border-color: #ff3b57;
      color: #fff;
    }
    .side-item.on {
      color: #102016;
      background: #7ddea8;
      border-color: #4caf78;
    }
    .side-backdrop {
      position: fixed; inset: 0; z-index: 44;
      background: rgba(0,0,0,0.25);
      border: 0; padding: 0; margin: 0; cursor: pointer;
    }
    .side-backdrop[hidden] { display: none !important; }
    html.app-fullscreen .side-backdrop { z-index: 10054; }
  </style>
</head>
<body>
  <div id="app">
    <header class="top-bar">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true"></span>
        <div class="brand-text">
          <strong>Conf. Armadura</strong>
          <span id="doc-label">Abra um PDF</span>
          <span id="app-revision" class="rev-label" title="Pré-Prumo + raster com teto de memória">Revisão 1.0.17</span>
        </div>
      </div>
      <div class="top-actions">
        <button type="button" id="btn-side-toggle" class="side-toggle" aria-expanded="false" aria-controls="side-panel" title="Abrir ou fechar">☰</button>
      </div>
    </header>

    <main class="stage">
      <div id="viewport" class="viewport">
        <div id="scene" class="scene">
          <canvas id="pdf-canvas"></canvas>
          <canvas id="detail-canvas" aria-hidden="true"></canvas>
          <canvas id="anno-canvas"></canvas>
          <div id="select-preview" aria-hidden="true"></div>
        </div>
      </div>
      <div id="hint" class="hint">Carregando…</div>
    </main>

    <aside id="report-panel" class="report-panel" hidden>
      <div class="report-head">
        <h2>Relatório</h2>
        <button type="button" id="btn-close-report" class="icon-btn" onclick="window.__closeConfReport && window.__closeConfReport()">✕</button>
      </div>
      <div id="report-body" class="report-body"></div>
      <div class="report-actions">
        <button type="button" id="btn-export-html" class="primary">Exportar HTML</button>
        <button type="button" id="btn-export-text" class="secondary">Copiar texto</button>
        <button type="button" id="btn-share" class="secondary">Compartilhar</button>
      </div>
    </aside>

    <aside id="library-panel" class="library-panel" hidden>
      <div class="report-head">
        <h2>Biblioteca de PDFs</h2>
        <button type="button" id="btn-close-library" class="icon-btn" title="Fechar">✕</button>
      </div>
      <div id="library-body" class="report-body">
        <p class="group-empty">Nenhum PDF importado ainda.</p>
      </div>
      <div class="report-actions">
        <label class="primary" style="display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 14px;border-radius:12px;cursor:pointer;">
          Importar PDF
          <input type="file" id="file-input-library" accept="application/pdf,.pdf" hidden />
        </label>
      </div>
    </aside>

    <div id="text-modal" class="modal" hidden>
      <div class="modal-card">
        <h3 id="text-modal-title">Nota no PDF</h3>
        <textarea id="text-input" rows="3" placeholder="Descreva o trecho ou o risco…" maxlength="500"></textarea>
        <div class="modal-actions">
          <button type="button" id="btn-text-cancel" class="secondary">Cancelar</button>
          <button type="button" id="btn-text-ok" class="primary">Confirmar</button>
        </div>
      </div>
    </div>

    <div id="delete-modal" class="modal" hidden>
      <div class="modal-card">
        <h3 id="delete-modal-title">Excluir marcação?</h3>
        <p id="delete-modal-body">Remover esta marcação do PDF e do relatório.</p>
        <div class="modal-actions">
          <button type="button" id="btn-delete-cancel" class="secondary">Cancelar</button>
          <button type="button" id="btn-delete-confirm" class="primary danger">Excluir</button>
        </div>
      </div>
    </div>

    <div id="autosave-chip" class="autosave-chip" aria-live="polite">Autosalvo</div>

    <div id="tool-dock" aria-label="Ferramentas flutuantes">
      <div class="dock-handle" id="dock-handle" role="button" tabindex="0" title="Recolher (clique) · Arrastar para mover">⋮⋮</div>
      <div class="dock-body" id="dock-body">
        <button type="button" class="tool dock-btn" data-tool="pan" aria-pressed="true" title="Mover"><span class="tool-icon" aria-hidden="true">✥</span></button>
        <button type="button" class="tool dock-btn" data-tool="ok" title="OK — arrastar sobre rótulo (verde)"><span class="tool-icon ok" aria-hidden="true">✓</span></button>
        <button type="button" class="tool dock-btn" data-tool="risk" title="Não conforme — arrastar + motivo (vermelho)"><span class="tool-icon risk" aria-hidden="true">✕</span></button>
        <div class="dock-sep" aria-hidden="true"></div>
        <button type="button" id="btn-fullscreen-dock" class="dock-btn" title="Expandir / sair da tela cheia" aria-pressed="false">⛶</button>
      </div>
    </div>

    <button type="button" id="side-backdrop" class="side-backdrop" hidden aria-label="Fechar menu"></button>
    <div id="side-panel" class="side-panel" hidden role="menu" aria-label="Ações">
      <label class="side-item" title="Abrir PDF">
        <span class="side-ico" aria-hidden="true">📄</span>
        <span>Abrir arquivos</span>
        <input type="file" id="file-input" accept="application/pdf,.pdf" hidden />
      </label>
      <button type="button" id="btn-report-menu" class="side-item accent" title="Relatório">
        <span class="side-ico" aria-hidden="true">📋</span>
        <span>Relatório</span>
      </button>
      <button type="button" id="btn-wake" class="side-item on" aria-pressed="true" title="Manter tela ligada">
        <span class="side-ico" aria-hidden="true">💡</span>
        <span id="btn-wake-label">Tela ligada</span>
      </button>
      <button type="button" id="btn-rotate" class="side-item" title="Girar 90°">
        <span class="side-ico" aria-hidden="true">⟳</span>
        <span>Girar 90°</span>
      </button>
      <button type="button" id="btn-library" class="side-item" title="Biblioteca de PDFs">
        <span class="side-ico" aria-hidden="true">📚</span>
        <span>Biblioteca</span>
      </button>
    </div>
  </div>

  <!-- PDF.js local first (Capacitor/Android). CDN só fallback no browser. -->
  <script src="vendor/pdfjs/pdf.min.js"></script>
  <script>
(function () {
  "use strict";

  var PDFJS_VER = "3.11.174";
  var PDFJS_LOCAL = "vendor/pdfjs/pdf.min.js";
  var PDFJS_WORKER_LOCAL = "vendor/pdfjs/pdf.worker.min.js";
  var PDFJS_CDN = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/" + PDFJS_VER + "/pdf.min.js";
  var PDFJS_WORKER_CDN = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/" + PDFJS_VER + "/pdf.worker.min.js";
  var pdfJsReady = null;
  var openingPdf = false;

  function uid() {
    if (crypto && crypto.randomUUID) return crypto.randomUUID();
    return "id-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 9);
  }

  var LIB_INDEX_KEY = "conf-armadura-library-v1";
  var LIB_FOLDER = "Download/ConfArmadura";
  var IDB_NAME = "conf-armadura-db";
  var IDB_STORE = "pdfs";

  function isNativeCapacitor() {
    try {
      return !!(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform());
    } catch (e) {
      return !!(window.Capacitor && (Capacitor.getPlatform && Capacitor.getPlatform() !== "web"));
    }
  }

  function capFilesystem() {
    try {
      return (window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.Filesystem) || null;
    } catch (e) {
      return null;

  async function writeNativePdfAndAnnots(entry, bytes, annotsJson) {

    var pdfData = bytesToBase64(bytes);
    var jsonData = bytesToBase64(new TextEncoder().encode(annotsJson || "[]"));
    var lastErr = null;
    for (var d = 0; d < NATIVE_DIRS.length; d++) {
      var dir = NATIVE_DIRS[d];

      var jsonPath = dir.folder + "/" + stem + ".annots.json";
      try {
        try {
          await fs.mkdir({ path: dir.folder, directory: dir.directory, recursive: true });
        } catch (e) {}
        await fs.writeFile({
          path: pdfPath,
          data: pdfData,
          directory: dir.directory,
          recursive: true

        await fs.writeFile({
          path: jsonPath,
          data: jsonData,
          directory: dir.directory,
          recursive: true

        entry.nativeDirectory = dir.directory;
        entry.nativeFolder = dir.folder;

  async function loadPdfFromLibrary(docId) {

      setDraft: function (v) { draft = v; },

        items.push(item);

        notify();

      add: function (item) {

        items.push(full);
        notify();
        return full;

      removeById: function (id) {

        return true;

        return null;
      },

        return {

          risk: items.filter(function (i) { return i.kind === "risk"; }),
          notes: items.filter(function (i) { return i.kind === "note"; }),
          arrows: items.filter(function (i) { return i.kind === "arrow"; }),
          strokes: items.filter(function (i) { return i.kind === "stroke"; }),

  function clearAnnoCanvasPixels(ctx) {

  // Do not swallow dimension "x" in tokens like VR-114x65 (that "x" is not a suffix letter).
  var STRUCT_CODE_RE = /\b((?:VG|VR|VT|LG|LR|LA|P|R)[\-\s]?\d+)([A-Za-z])?(?=\b|[xX×]|$)/i;
  var DIM_ONLY_RE = /^(?:\d{1,3}\s*[xX×]\s*\d{1,3}.*|h\s*=\s*\d)/i;

    if (!m) return "";

    if (m[2] && !/^[xX×]$/.test(m[2])) code += m[2];
    return code;

  function classifyLabel(text) {

    if (!key) return "elemento";
    if (/^P[\-]?\d/.test(key) || /\bPILAR\b/.test(t) || /\bP[\s\-.]?\d/.test(t)) return "pilar";
    if (/^(VG|VR|VT)/.test(key) || /\bVIGA\b/.test(t) || /\bV[GRT][\s\-]?\d/.test(t)) return "viga";
    if (/^(LG|LR|LA)/.test(key) || /^R[\-]?\d/.test(key) || /\bLAJE\b/.test(t) || /\bLG[\s\-]?\d/.test(t)) return "laje";
    return "elemento";

  /** Collapse repeated dim phrases: "14x90 14x90 14x90" → "14x90". */
  function dedupeDimTokens(text) {
    var s = String(text || "").replace(/\s+/g, " ").trim();

    var re = /\d+\s*[xX×]\s*\d+(?:\s*\([^)]*\))?|h\s*=\s*[\d.,]+|[^\s]+/gi;
    var m;
    while ((m = re.exec(s))) phrases.push(String(m[0]).replace(/\s+/g, " ").trim());

    var out = [];
    for (var i = 0; i < phrases.length; i++) {
      var key = phrases[i].toLowerCase().replace(/\s+/g, "");
      if (seen[key]) continue;
      seen[key] = true;
      out.push(phrases[i]);

    return out.join(" ");

  function splitLabelNameDims(label) {

      .replace(/\s*[·•]\s*/g, " ")
      .replace(/\s+/g, " ")

    // Always prefer a letter+number code anywhere in the string (never lead with 25x50 / h=15).
    var code = extractStructuralCode(s);
    if (code) {

        .replace(new RegExp(code.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "ig"), " ")
        .replace(/\s+/g, " ")
        .replace(/^[\s\-–—]+|[\s\-–—]+$/g, "")
        .trim();

      if (glued) {
        var stem = glued[1];
        var num = (stem.match(/\d+$/) || [""])[0];
        code = stem;
        rest = (num + "x" + glued[2] + (rest ? " " + rest : "")).replace(/\s+/g, " ").trim();

      return {
        name: code,
        dims: rest,
        display: code + (rest ? " · " + rest : "")

    }

    // No structural code found — keep raw, but never invent a "name" from pure dims.
    if (DIM_ONLY_RE.test(s)) {

      return { name: "", dims: onlyDims, display: onlyDims };

    return { name: s, dims: "", display: s };

      return (elementTypeLabel(item.elementType || classifyLabel(okParts.display)) + " conferido")
        + (okParts.display ? " (" + okParts.display + ")" : "");
    }
    if (item.kind === "risk") {
      var riskParts = splitLabelNameDims(item.label || item.text || "");
      return "Não conforme"
        + (riskParts.display ? " — " + riskParts.display : "")
        + (item.reason ? " · motivo: " + item.reason : "");
    }
    if (item.kind === "note") return item.mode === "ok" ? "Nota OK" : "Nota de risco";
    if (item.kind === "arrow") return item.mode === "ok" ? "Seta OK" : "Seta risco";
    if (item.kind === "stroke") {
      if (item.mode === "ok") return "Traço OK";

        strokes: summary.strokes.length,

  function reportNameDims(item) {
    // Use one canonical string — joining name+dims+label+text tripled dims (14x90×3).

    var dims = String(item.dims || "").trim();
    var raw = label;
    if (!raw) raw = [name, dims].filter(Boolean).join(" ");

      raw = name + (dims ? " " + dims : "") + " " + label;
    }
    var parts = splitLabelNameDims(raw);
    parts.dims = dedupeDimTokens(parts.dims);

      ? (parts.name + (parts.dims ? " · " + parts.dims : ""))

  function itemVplType(item) {

  function groupItemsByVpl(items) {

  function reportHeadHtml(item) {

    // Prefer any code still buried in display; never lead with bare dims if we can help it.
    var code = extractStructuralCode(parts.display || item.label || item.text || "");
    if (code) {
      var rest = splitLabelNameDims((parts.display || "") + " " + code);
      return "<strong>" + escapeHtml(code) + "</strong>"
        + (rest.dims ? " · " + escapeHtml(rest.dims) : "");

    return escapeHtml(parts.display || item.label || item.text || "—");
  }

  function reportHeadText(item) {
    var parts = reportNameDims(item);
    if (parts.name) return parts.name + (parts.dims ? " · " + parts.dims : "");
    var code = extractStructuralCode(parts.display || item.label || item.text || "");
    if (code) {
      var rest = splitLabelNameDims((parts.display || "") + " " + code);
      return code + (rest.dims ? " · " + rest.dims : "");

  var VPL_SECTIONS = [

    { key: "outro", title: "Outros" }

  function renderGroupedLisHtml(items, lineFn) {
    var groups = groupItemsByVpl(items);
    var html = "";
    var any = false;
    VPL_SECTIONS.forEach(function (sec) {
      var list = groups[sec.key] || [];
      if (!list.length) {
        if (sec.key === "outro") return;
        html += "<h4>" + escapeHtml(sec.title) + "</h4><p class=\"group-empty\">Nenhum</p>";
        return;
      }
      any = true;
      html += "<h4>" + escapeHtml(sec.title) + "</h4><ul>";
      list.forEach(function (item, idx) {
        html += lineFn(item, idx);
      });
      html += "</ul>";
    });
    return { html: html, any: any || !!(items && items.length) };

  function renderReportHtmlFragment(model) {

    });

      return "<li>" + escapeHtml(String(r.text || "(vazia)")) + " <em>(" + escapeHtml(labelFor(r)) + ")</em></li>";
    }).join("");

    var riskGroups = groupItemsByVpl(model.risks);

      + '<div class="summary">'
      + '<div class="stat ok"><strong>' + model.counts.ok + '</strong><span>Conferidos</span></div>'

      + '<p><strong>Documento:</strong> ' + escapeHtml(model.docName) + '<br/>'
      + '<strong>Gerado em:</strong> ' + escapeHtml(fmtTime(model.generatedAt)) + '<br/>'
      + '<strong>OK:</strong> V ' + okGroups.viga.length
      + ' · P ' + okGroups.pilar.length
      + ' · L ' + okGroups.laje.length

  function appendGroupedPlain(lines, title, items, lineFn) {
    lines.push("", title);

      lines.push("- Nenhum");

    var groups = groupItemsByVpl(items);
    VPL_SECTIONS.forEach(function (sec) {
      var list = groups[sec.key] || [];
      if (!list.length && sec.key === "outro") return;
      lines.push("", sec.title);
      if (!list.length) {
        lines.push("- Nenhum");
        return;
      }
      list.forEach(function (item, idx) {
        lines.push(lineFn(item, idx));

  function buildPlainTextReport(model) {
    var lines = [
      model.title,
      "Documento: " + model.docName,
      "Gerado em: " + fmtTime(model.generatedAt),
      "",
      "Resumo: " + model.counts.ok + " conferidos · " + model.counts.risk + " não conformes · " + model.counts.total + " marcações"

  /** High-res tile for the visible region after pan/zoom gesture ends (Prumo-style refine). */
  async function refineVisibleDetail() {
    if (!state.pdf || !state.pdfPage || !state.pageInfo || !els.detailCanvas) return;
    if (openingPdf || state.drawing || state.pinching || state.panStart) return;

    var screenPerCss = state.scale * dpr;

    if (screenPerCss <= overviewPerCss * 1.15) {
      clearDetailCanvas();
      return;

    var vis = visiblePageRect();
    if (!vis || vis.w < 8 || vis.h < 8) return;
    var targetPerCss = Math.min(screenPerCss, isNativeCapacitor() ? 4 : 10);
    var tileCssW = vis.w, tileCssH = vis.h;
    var pxW = tileCssW * targetPerCss, pxH = tileCssH * targetPerCss;
    if (pxW * pxH > MAX_DETAIL_PIXELS) {
      var k = Math.sqrt(MAX_DETAIL_PIXELS / (pxW * pxH));
      targetPerCss *= k;
      pxW = tileCssW * targetPerCss;
      pxH = tileCssH * targetPerCss;

    pxW = Math.max(32, Math.floor(pxW));
    pxH = Math.max(32, Math.floor(pxH));

    canvas.height = pxH;

    var transform = [1, 0, 0, 1, -vis.x * hiScale, -vis.y * hiScale];
    await page.render({ canvasContext: ctx, viewport: viewport, transform: transform }).promise;
    if (token !== state.refineToken || openingPdf) return;
    els.detailCanvas.width = pxW;
    els.detailCanvas.height = pxH;
    els.detailCanvas.style.display = "block";
    els.detailCanvas.style.width = vis.w + "px";
    els.detailCanvas.style.height = vis.h + "px";
    els.detailCanvas.style.transform = "translate3d(" + vis.x + "px," + vis.y + "px,0)";
    var dctx = els.detailCanvas.getContext("2d", { alpha: false });

          savePdfToLibrary(keep, label, { docId: docId }).catch(function (err) {
            console.warn("Não foi possível guardar na biblioteca", err);
          });
        }, 0);
      }
    } catch (err) {
      console.error(err);
      setHint("Falha ao abrir o PDF. Tente Importar novamente ou a Biblioteca.");
      setTimeout(function () { setHint(""); }, 3500);
    } finally {
      openingPdf = false;
      state.openingBlockedTools = false;
    }
  }

  function fmtBytes(n) {
    if (!n && n !== 0) return "";
    if (n < 1024) return n + " B";
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
    return (n / (1024 * 1024)).toFixed(1) + " MB";
  }

  function renderLibraryList() {
    if (!els.libraryBody) return;
    var index = readLibraryIndex();
    if (!index.pdfs.length) {
      els.libraryBody.innerHTML = "<p class=\"group-empty\">Nenhum PDF importado ainda. Use Importar PDF — arquivos vão para <strong>Download/ConfArmadura</strong> no app.</p>";
      return;
    }
    els.libraryBody.innerHTML = index.pdfs.map(function (p) {
      var when = p.updatedAt || p.importedAt || "";
      var annotCount = loadAnnotsForDoc(p.id).length;
      return ""
        + "<div class=\"lib-item\" data-id=\"" + escapeHtml(p.id) + "\">"
        + "<div class=\"lib-meta\">"
        + "<strong>" + escapeHtml(p.name) + "</strong>"
        + "<span>" + escapeHtml(fmtBytes(p.size))
        + (when ? " · " + escapeHtml(fmtTime(when)) : "")
        + " · " + annotCount + " marcação(ões)</span>"
        + "</div>"
        + "<div class=\"lib-actions\">"
        + "<button type=\"button\" data-act=\"open\">Abrir</button>"
        + "<button type=\"button\" data-act=\"del\" title=\"Remover\">⌫</button>"
        + "</div></div>";
    }).join("");
  }

  function openLibrary() {
    try { closeReport(); } catch (e) {}
    renderLibraryList();
    if (els.libraryPanel) {
      els.libraryPanel.hidden = false;
      els.libraryPanel.removeAttribute("hidden");
      els.libraryPanel.style.display = "flex";
    }
  }

  function closeLibrary() {
    if (!els.libraryPanel) return;
    els.libraryPanel.hidden = true;
    els.libraryPanel.setAttribute("hidden", "");
    els.libraryPanel.style.display = "none";
  }

  window.__openConfLibrary = openLibrary;
  window.__closeConfLibrary = closeLibrary;

  async function importPdfFile(file) {
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function () {
      openPdfBytes(new Uint8Array(reader.result), file.name || "prancha.pdf");
      closeLibrary();
    };
    reader.readAsArrayBuffer(file);
  }

  function startStroke(point) {
    annotations.setDraft({ kind: "stroke", mode: state.contentMode, width: 3, points: [point] });
    state.drawing = true;
    redrawAnnotations();
  }
  function extendStroke(point) {
    var draft = annotations.getDraft();
    if (!draft || draft.kind !== "stroke") return;
    var pts = draft.points, last = pts[pts.length - 1];
    if (!last || Math.hypot(point.x - last.x, point.y - last.y) < 1.2) return;
    pts.push(point);
    redrawAnnotations();
  }
  function endStroke() {
    var draft = annotations.getDraft();
    if (draft && draft.kind === "stroke" && draft.points && draft.points.length > 1) annotations.commitDraft();
    else annotations.setDraft(null);
    state.drawing = false;
    redrawAnnotations();
    finishToMove();
  }
  function hideSelectPreview() {
    var el = els.selectPreview;
    if (!el) return;
    el.className = "";
    el.style.width = "0";
    el.style.height = "0";
    el.style.transform = "translate3d(0,0,0)";
  }

  function paintSelectPreview(drag) {
    var el = els.selectPreview;
    if (!el || !drag) return;
    var w = Math.max(0, drag.w);
    var h = Math.max(0, drag.h);
    el.className = "on " + (drag.mode === "ok" ? "ok" : "risk");
    el.style.width = w + "px";
    el.style.height = h + "px";
    el.style.transform = "translate3d(" + drag.x + "px," + drag.y + "px,0)";
  }

  function clearSelectDrag() {
    if (state.selectRaf) {
      cancelAnimationFrame(state.selectRaf);
      state.selectRaf = 0;
    }
    state.selectDrag = null;
    hideSelectPreview();
  }

  function startSelect(point) {
    // Preview only — never touch pdf.js / OCR / anno canvas during drag.
    state.savedView = snapshotView();
    state.selectDrag = {
      mode: state.tool === "ok" ? "ok" : "risk",
      x0: point.x,
      y0: point.y,
      x: point.x,
      y: point.y,
      w: 0,
      h: 0
    };
    state.drawing = true;
    paintSelectPreview(state.selectDrag);
  }

  function updateSelect(point) {
    var drag = state.selectDrag;
    if (!drag) return;
    var n = normalizeSel(drag.x0, drag.y0, point.x, point.y);
    drag.x = n.x;
    drag.y = n.y;
    drag.w = n.w;
    drag.h = n.h;
    // Coalesce paints to one CSS update per frame — no canvas, no text scan.
    if (!state.selectRaf) {
      state.selectRaf = requestAnimationFrame(function () {
        state.selectRaf = 0;
        if (state.selectDrag) paintSelectPreview(state.selectDrag);
      });
    }
  }

  function commitSelectResult(sel, rec) {
    var label = rec.label || "(sem texto)";
    var parts = splitLabelNameDims(label);
    var elementType = classifyLabel(label);
    var box = highlightBoxFromRecognition(sel, rec);
    if (sel.mode === "ok") {
      annotations.add({
        kind: "ok",
        x: box.x, y: box.y, w: box.w, h: box.h,
        label: parts.display || label,
        text: parts.display || label,
        name: parts.name,
        dims: parts.dims,
        elementType: elementType,
        source: rec.source
      });
      redrawAnnotations();
      setHint((parts.name || label).slice(0, 48) + " ✓");
      setTimeout(function () { setHint(""); }, 1400);
      var snap = state.savedView || snapshotView();
      finishToMove();
      restoreView(snap);
      state.savedView = null;
      setTimeout(function () { restoreView(snap); scheduleViewRefine(180); }, 160);
    } else {
      state.riskPending = {
        x: box.x, y: box.y, w: box.w, h: box.h,
        label: parts.display || label,
        text: parts.display || label,
        name: parts.name,
        dims: parts.dims,
        elementType: elementType,
        source: rec.source
      };
      openRiskReasonModal();
    }
  }

  function endSelect() {
    state.drawing = false;
    var drag = state.selectDrag;
    if (state.selectRaf) {
      cancelAnimationFrame(state.selectRaf);
      state.selectRaf = 0;
    }
    clearSelectDrag();
    if (!drag) {
      finishToMove();
      return;
    }
    var raw = { x: drag.x, y: drag.y, w: drag.w, h: drag.h };
    var sel = { x: drag.x, y: drag.y, w: drag.w, h: drag.h, mode: drag.mode };
    if (raw.w < 8 || raw.h < 8) {
      setHint("Arraste sobre o rótulo (ex.: VG-114x90).");
      setTimeout(function () { setHint(""); }, 1800);
      finishToMove();
      return;
    }

    try {
      // Recognize ONLY on pointerup (pdf.js text layer). Snap fill to glyph bbox here.
      var rec = recognizeSelectionLabelFast(raw) || { label: "", bbox: null, source: "none" };
      if (rec.bbox && rec.bbox.w > 2) {
        sel.x = rec.bbox.x; sel.y = rec.bbox.y; sel.w = rec.bbox.w; sel.h = rec.bbox.h;
      }
      if (rec.label || (rec.bbox && rec.bbox.w > 2)) {
        commitSelectResult(sel, rec);
        return;
      }
    } catch (err) {
      console.warn(err);
    }

    // No PDF text hit: still place the box immediately (never freeze waiting on OCR).
    // OCR only on desktop browsers and only in background without blocking tools.
    if (sel.mode === "ok") {
      annotations.add({
        kind: "ok",
        x: sel.x, y: sel.y, w: sel.w, h: sel.h,
        label: "(sem texto)",
        text: "(sem texto)",
        elementType: "elemento",
        source: "manual"
      });
      redrawAnnotations();
      finishToMove();
      setHint("Marcação OK sem texto PDF — confira o trecho.");
      setTimeout(function () { setHint(""); }, 2000);
    } else {
      state.riskPending = {
        x: sel.x, y: sel.y, w: sel.w, h: sel.h,
        label: "(sem texto)",
        text: "(sem texto)",
        name: "",
        dims: "",
        elementType: "elemento",
        source: "manual"
      };
      openRiskReasonModal();
    }

    if (!isNativeCapacitor()) {
      var rawBox = { x: raw.x - 8, y: raw.y - 8, w: raw.w + 16, h: raw.h + 16 };
      Promise.race([
        ocrSelection(rawBox),
        new Promise(function (resolve) {
          setTimeout(function () { resolve({ label: "", bbox: null }); }, 4000);
        })
      ]).then(function (fromOcr) {
        if (!fromOcr || !fromOcr.label) return;
        var list = annotations.list();
        var last = list.length ? list[list.length - 1] : null;
        if (!last || last.source !== "manual") return;
        var parts = splitLabelNameDims(fromOcr.label);
        var box = fromOcr.bbox && fromOcr.bbox.w > 2 ? fromOcr.bbox : { x: last.x, y: last.y, w: last.w, h: last.h };
        last.label = parts.display || fromOcr.label;
        last.text = last.label;
        last.name = parts.name;
        last.dims = parts.dims;
        last.elementType = classifyLabel(last.label);
        last.source = "ocr";
        last.x = box.x; last.y = box.y; last.w = box.w; last.h = box.h;
        redrawAnnotations();
      }).catch(function () {});
    }
  }

  function startArrow(point) {
    state.savedView = snapshotView();
    annotations.setDraft({ kind: "arrow", mode: state.contentMode, x1: point.x, y1: point.y, x2: point.x, y2: point.y });
    state.drawing = true;
    redrawAnnotations();
  }
  function updateArrow(point) {
    var draft = annotations.getDraft();
    if (!draft || draft.kind !== "arrow") return;
    draft.x2 = point.x; draft.y2 = point.y;
    redrawAnnotations();
  }
  function endArrow() {
    var snap = state.savedView || snapshotView();
    var draft = annotations.getDraft();
    if (draft && draft.kind === "arrow") {
      if (Math.hypot(draft.x2 - draft.x1, draft.y2 - draft.y1) > 8) annotations.commitDraft();
      else annotations.setDraft(null);
    }
    state.drawing = false;
    redrawAnnotations();
    finishToMove();
    restoreView(snap);
    state.savedView = null;
    setTimeout(function () { restoreView(snap); scheduleViewRefine(180); }, 160);
  }
  function openNoteModal(point) {
    state.savedView = snapshotView();
    state.modalMode = "note";
    state.notePending = point;
    state.riskPending = null;
    els.textModalTitle.textContent = state.contentMode === "ok" ? "Nota OK no PDF" : "Nota de risco no PDF";
    els.textInput.placeholder = "Descreva o trecho ou o risco…";
    els.textInput.value = "";
    els.textModal.hidden = false;
    setTimeout(function () { els.textInput.focus(); }, 50);
  }
  function openRiskReasonModal() {
    state.savedView = snapshotView();
    state.modalMode = "risk-reason";
    var pending = state.riskPending || {};
    els.textModalTitle.textContent = "Motivo do erro"
      + (pending.label ? " — " + pending.label : "");
    els.textInput.placeholder = "Digite o motivo da não conformidade…";
    els.textInput.value = "";
    els.textModal.hidden = false;
    // Preview red highlight while editing reason
    annotations.setDraft({
      kind: "risk",
      x: pending.x, y: pending.y, w: pending.w, h: pending.h,
      label: pending.label
    });
    redrawAnnotations();
    setTimeout(function () { els.textInput.focus(); }, 50);
  }
  function closeNoteModal() {
    var snap = state.savedView || snapshotView();
    els.textModal.hidden = true;
    state.notePending = null;
    if (state.modalMode === "risk-reason") {
      annotations.setDraft(null);
      state.riskPending = null;
      redrawAnnotations();
    }
    state.modalMode = "note";
    finishToMove();
    restoreView(snap);
    state.savedView = null;
    setTimeout(function () { restoreView(snap); }, 0);
    setTimeout(function () { restoreView(snap); scheduleViewRefine(200); }, 160);
    setTimeout(function () { restoreView(snap); }, 360);
  }
  function saveNote() {
    var text = els.textInput.value.trim();
    if (state.modalMode === "risk-reason") {
      if (!text || !state.riskPending) {
        setHint("Informe o motivo do erro.");
        setTimeout(function () { setHint(""); }, 1800);
        return;
      }
      var snap = state.savedView || snapshotView();
      var p = state.riskPending;
      annotations.setDraft(null);
      annotations.add({
        kind: "risk",
        x: p.x, y: p.y, w: p.w, h: p.h,
        label: p.label,
        text: p.label,
        name: p.name || "",
        dims: p.dims || "",
        elementType: p.elementType,
        reason: text,
        source: p.source
      });
      state.riskPending = null;
      state.modalMode = "note";
      els.textModal.hidden = true;
      redrawAnnotations();
      setHint("Não conforme registrado.");
      setTimeout(function () { setHint(""); }, 1800);
      finishToMove();
      restoreView(snap);
      state.savedView = null;
      setTimeout(function () { restoreView(snap); }, 0);
      setTimeout(function () { restoreView(snap); scheduleViewRefine(200); }, 160);
      setTimeout(function () { restoreView(snap); }, 360);
      return;
    }
    if (!text || !state.notePending) { closeNoteModal(); return; }
    annotations.add({ kind: "note", mode: state.contentMode, x: state.notePending.x, y: state.notePending.y, text: text });
    closeNoteModal();
    redrawAnnotations();
  }

  function onPointerDown(e) {
    if (openingPdf || state.openingBlockedTools) {
      setHint("Aguarde — abrindo PDF…");
      return;
    }
    try { els.viewport.setPointerCapture(e.pointerId); } catch (err) {}
    state.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (state.pointers.size === 2) {
      state.pinching = true;
      state.drawing = false;
      state.panStart = null;
      annotations.setDraft(null);
      clearSelectDrag();
      clearDetailCanvas(); // CSS zoom only during gesture
      var pts = Array.from(state.pointers.values());
      var a = pts[0], b = pts[1];
      state.pinch = {
        dist: Math.hypot(a.x - b.x, a.y - b.y),
        scale: state.scale,
        tx: state.tx,
        ty: state.ty
      };
      return;
    }
    if (state.tool === "pan" || e.button === 1) {
      clearDetailCanvas();
      state.panStart = { x: e.clientX, y: e.clientY, tx: state.tx, ty: state.ty, moved: false };
      state.tapCandidate = { x: e.clientX, y: e.clientY };
      return;
    }
    var point = clientToPage(e.clientX, e.clientY);
    // While drawing OK/X, tapping an existing mark opens delete instead of a tiny drag.
    if (state.tool === "ok" || state.tool === "risk") {
      var hit = hitTestOkRisk(point);
      if (hit) {
        openDeleteAnnotationModal(hit);
        return;
      }
      startSelect(point);
    }
  }

  function onPointerMove(e) {
    if (!state.pointers.has(e.pointerId)) return;
    state.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (state.pinching && state.pointers.size >= 2) {
      var pts = Array.from(state.pointers.values());
      var a = pts[0], b = pts[1];
      var dist = Math.hypot(a.x - b.x, a.y - b.y);
      var midX = (a.x + b.x) / 2, midY = (a.y + b.y) / 2;
      var ratio = dist / Math.max(1, state.pinch.dist);
      var nextScale = clamp(state.pinch.scale * ratio, ZOOM_MIN, ZOOM_MAX);
      var rect = els.viewport.getBoundingClientRect();
      var localMidX = midX - rect.left, localMidY = midY - rect.top;
      var worldX = (localMidX - state.pinch.tx) / state.pinch.scale;
      var worldY = (localMidY - state.pinch.ty) / state.pinch.scale;
      state.scale = nextScale;
      state.tx = localMidX - worldX * nextScale;
      state.ty = localMidY - worldY * nextScale;
      applySceneTransform();
      return;
    }
    if (state.panStart && state.tool === "pan") {
      var dx = e.clientX - state.panStart.x;
      var dy = e.clientY - state.panStart.y;
      if (!state.panStart.moved && (dx * dx + dy * dy) > 64) state.panStart.moved = true;
      if (state.panStart.moved) {
        state.tx = state.panStart.tx + dx;
        state.ty = state.panStart.ty + dy;
        applySceneTransform();
      }
      return;
    }
    if (!state.drawing) return;
    var point = clientToPage(e.clientX, e.clientY);
    if (state.tool === "ok" || state.tool === "risk") updateSelect(point);
  }

  function onPointerUp(e) {
    var wasPinching = state.pinching;
    var wasPanning = !!state.panStart;
    var panMoved = !!(state.panStart && state.panStart.moved);
    var tapAt = state.tapCandidate;
    state.pointers.delete(e.pointerId);
    if (state.pointers.size < 2) state.pinching = false;
    if (state.pointers.size === 0) {
      state.panStart = null;
      state.tapCandidate = null;
    }
    if (state.drawing) {
      if (state.tool === "ok" || state.tool === "risk") endSelect();
    } else if (
      wasPanning && !panMoved && !wasPinching &&
      state.tool === "pan" && tapAt && state.pointers.size === 0
    ) {
      var pagePt = clientToPage(e.clientX, e.clientY);
      var hit = hitTestOkRisk(pagePt);
      if (hit) openDeleteAnnotationModal(hit);
    }
    try {
      if (els.viewport.hasPointerCapture && els.viewport.hasPointerCapture(e.pointerId)) {
        els.viewport.releasePointerCapture(e.pointerId);
      }
    } catch (err) {}
    if (state.pointers.size === 0 && (wasPinching || (wasPanning && panMoved))) {
      scheduleViewRefine(wasPinching ? 180 : 280);
    }
  }

  function onWheel(e) {
    e.preventDefault();
    if (openingPdf) return;
    clearDetailCanvas();
    var rect = els.viewport.getBoundingClientRect();
    var localX = e.clientX - rect.left, localY = e.clientY - rect.top;
    var worldX = (localX - state.tx) / state.scale;
    var worldY = (localY - state.ty) / state.scale;
    var factor = e.deltaY < 0 ? 1.12 : 0.9;
    state.scale = clamp(state.scale * factor, ZOOM_MIN, ZOOM_MAX);
    state.tx = localX - worldX * state.scale;
    state.ty = localY - worldY * state.scale;
    applySceneTransform();
    scheduleViewRefine(200);
  }

  function isAppFullscreen() {
    return !!state.fullscreenOn;
  }

  function syncFullscreenUi() {
    var on = !!state.fullscreenOn;
    document.documentElement.classList.toggle("app-fullscreen", on);
    if (els.btnFullscreen) {
      els.btnFullscreen.setAttribute("aria-pressed", String(on));
      els.btnFullscreen.textContent = on ? "⛶ Sair" : "⛶ Expandir";
      els.btnFullscreen.classList.toggle("on", on);
    }
    if (els.btnFullscreenDock) {
      els.btnFullscreenDock.setAttribute("aria-pressed", String(on));
      els.btnFullscreenDock.classList.toggle("fs-on", on);
      els.btnFullscreenDock.title = on ? "Sair da tela cheia" : "Expandir tela";
      els.btnFullscreenDock.textContent = on ? "❐" : "⛶";
    }
    clearTimeout(state.resizeTimer);
    state.resizeTimer = setTimeout(function () {
      if (!state.pageInfo) return;
      if (state.savedView) restoreView(state.savedView);
      else applySceneTransform();
      scheduleViewRefine(200);
    }, 80);
  }

  async function enterFullscreen() {
    state.fullscreenOn = true;
    document.documentElement.classList.add("app-fullscreen");
    syncFullscreenUi();
    try {
      var root = document.documentElement;
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (root.requestFullscreen) await root.requestFullscreen();
        else if (root.webkitRequestFullscreen) root.webkitRequestFullscreen();
      }
    } catch (err) {
      // WebView often blocks Fullscreen API — CSS immersive still active.
      console.warn(err);
    }
    try {
      var StatusBar = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.StatusBar;
      if (StatusBar && StatusBar.hide) await StatusBar.hide();
    } catch (e2) {}
  }

  async function exitFullscreen() {
    state.fullscreenOn = false;
    document.documentElement.classList.remove("app-fullscreen");
    syncFullscreenUi();
    try {
      if (document.fullscreenElement && document.exitFullscreen) await document.exitFullscreen();
      else if (document.webkitFullscreenElement && document.webkitExitFullscreen) document.webkitExitFullscreen();
    } catch (err) {
      console.warn(err);
    }
    try {
      var StatusBar = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.StatusBar;
      if (StatusBar && StatusBar.show) await StatusBar.show();
    } catch (e2) {}
  }

  function toggleFullscreen() {
    if (isAppFullscreen()) exitFullscreen();
    else enterFullscreen();
  }

  function bindFullscreenControls() {
    if (els.btnFullscreen) els.btnFullscreen.addEventListener("click", function (e) {
      e.preventDefault();
      toggleFullscreen();
    });
    if (els.btnFullscreenDock) els.btnFullscreenDock.addEventListener("click", function (e) {
      e.preventDefault();
      toggleFullscreen();
    });
    document.addEventListener("fullscreenchange", function () {
      // Browser ESC exits native fullscreen — mirror into app state.
      if (!document.fullscreenElement && !document.webkitFullscreenElement && state.fullscreenOn) {
        // Keep CSS immersive unless user pressed our Sair; ESC should exit fully.
        state.fullscreenOn = false;
        syncFullscreenUi();
      }
    });
    document.addEventListener("webkitfullscreenchange", function () {
      if (!document.fullscreenElement && !document.webkitFullscreenElement && state.fullscreenOn) {
        state.fullscreenOn = false;
        syncFullscreenUi();
      }
    });
    try {
      var App = window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.App;
      if (App && App.addListener) {
        App.addListener("backButton", function (ev) {
          if (isSideMenuOpen()) {
            setSideMenuOpen(false);
            return;
          }
          if (isAppFullscreen()) {
            exitFullscreen();
            return;
          }
          if (els.deleteModal && !els.deleteModal.hidden) {
            closeDeleteAnnotationModal();
            return;
          }
          if (els.textModal && !els.textModal.hidden) {
            closeNoteModal();
            return;
          }
          var panel = document.getElementById("report-panel");
          if (panel && !panel.hidden) {
            closeReport();
            return;
          }
          if (ev && ev.canGoBack) window.history.back();
        });
      }
    } catch (err) {
      console.warn(err);
    }
  }

  function updateWakeUi() {
    var on = isWakeEnabled();
    if (!els.btnWake) return;
    els.btnWake.classList.toggle("on", on);
    els.btnWake.setAttribute("aria-pressed", String(on));
    if (els.btnWakeLabel) els.btnWakeLabel.textContent = on ? "Tela ligada" : "Tela pode apagar";
    else els.btnWake.textContent = on ? "Tela ligada" : "Tela pode apagar";
  }

  function toggleWake() {
    setWakeEnabled(!isWakeEnabled()).then(function (result) {
      updateWakeUi();
      if (isWakeEnabled() && !result.ok) {
        setHint("Wake Lock indisponível neste contexto (tente http://localhost).");
        setTimeout(function () { setHint(""); }, 3200);
      }
    });
  }

  function rotateView() {
    state.viewRotation = (state.viewRotation + 90) % 360;
    centerPage();
    setHint("Visualização " + state.viewRotation + "°");
    setTimeout(function () { setHint(""); }, 1200);
  }

  function openReport(event) {
    try { if (event && event.preventDefault) event.preventDefault(); } catch (e) {}
    try {
      var panel = document.getElementById("report-panel");
      var body = document.getElementById("report-body");
      var model = buildReportModel(state.docName, annotations);
      state.lastReportModel = model;
      if (body) body.innerHTML = renderReportHtmlFragment(model);
      if (panel) {
        panel.hidden = false;
        panel.removeAttribute("hidden");
        panel.style.display = "flex";
      }
      setHint("");
    } catch (err) {
      console.error(err);
      setHint("Não foi possível montar o relatório.");
      setTimeout(function () { setHint(""); }, 2500);
    }
  }

  function closeReport() {
    var panel = document.getElementById("report-panel");
    if (!panel) return;
    panel.hidden = true;
    panel.setAttribute("hidden", "");
    panel.style.display = "none";
  }

  window.__openConfReport = openReport;
  window.__closeConfReport = closeReport;

  function downloadBlob(filename, blob) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
  }

  function exportHtml() {
    if (!state.lastReportModel) openReport();
    downloadBlob(
      "relatorio-conferencia-armadura-" + Date.now() + ".html",
      new Blob([buildExportableHtmlDocument(state.lastReportModel)], { type: "text/html;charset=utf-8" })
    );
  }

  function copyText() {
    if (!state.lastReportModel) openReport();
    var text = buildPlainTextReport(state.lastReportModel);
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(function () {
        setHint("Relatório copiado.");
        setTimeout(function () { setHint(""); }, 1800);
      }).catch(function () { window.prompt("Copie o relatório:", text); });
    } else {
      window.prompt("Copie o relatório:", text);
    }
  }

  function shareReport() {
    if (!state.lastReportModel) openReport();
    var text = buildPlainTextReport(state.lastReportModel);
    if (navigator.share) {
      navigator.share({ title: "Relatório Conf. Armadura", text: text }).catch(function () { copyText(); });
    } else {
      copyText();
    }
  }

  function isSideMenuOpen() {
    return !!(els.sidePanel && !els.sidePanel.hidden);
  }

  function setSideMenuOpen(open) {
    if (!els.sidePanel || !els.btnSideToggle) return;
    els.sidePanel.hidden = !open;
    els.btnSideToggle.setAttribute("aria-expanded", String(!!open));
    if (els.sideBackdrop) {
      if (open) {
        // Defer backdrop so the same tap that opens the menu does not instantly close it.
        clearTimeout(setSideMenuOpen._backdropTimer);
        setSideMenuOpen._backdropTimer = setTimeout(function () {
          if (isSideMenuOpen()) els.sideBackdrop.hidden = false;
        }, 40);
      } else {
        clearTimeout(setSideMenuOpen._backdropTimer);
        els.sideBackdrop.hidden = true;
      }
    }
  }

  function toggleSideMenu() {
    setSideMenuOpen(!isSideMenuOpen());
  }

  function bindSideMenu() {
    if (els.btnSideToggle) {
      els.btnSideToggle.addEventListener("click", function (e) {
        e.preventDefault();
        e.stopPropagation();
        toggleSideMenu();
      });
    }
    if (els.sideBackdrop) {
      els.sideBackdrop.addEventListener("click", function (e) {
        e.preventDefault();
        setSideMenuOpen(false);
      });
    }
    if (els.btnReportMenu) {
      els.btnReportMenu.addEventListener("click", function (e) {
        setSideMenuOpen(false);
        if (window.__openConfReport) window.__openConfReport(e);
      });
    }
    // Close menu after choosing open/library actions that change context.
    if (els.fileInput) {
      els.fileInput.addEventListener("change", function () { setSideMenuOpen(false); });
    }
    if (els.btnLibrary) {
      els.btnLibrary.addEventListener("click", function () { setSideMenuOpen(false); });
    }
  }

  function bindFloatingDock() {
    var dock = document.getElementById("tool-dock");
    var handle = document.getElementById("dock-handle");
    if (!dock || !handle) return;

    var collapsed = false;
    var dragging = false;
    var dragMoved = false;
    var startX = 0, startY = 0, origLeft = 0, origTop = 0;
    var posKey = "conf-armadura-dock-pos";

    function applyCollapsed() {
      dock.classList.toggle("collapsed", collapsed);
      handle.title = collapsed
        ? "Expandir ferramentas (clique) · Arrastar para mover"
        : "Recolher (clique) · Arrastar para mover";
      handle.setAttribute("aria-expanded", String(!collapsed));
      handle.setAttribute("aria-label", collapsed ? "Expandir ferramentas" : "Recolher ferramentas");
    }

    function toggleCollapsed() {
      collapsed = !collapsed;
      applyCollapsed();
      requestAnimationFrame(clampDock);
    }

    function clampDock() {
      var rect = dock.getBoundingClientRect();
      var maxL = Math.max(8, window.innerWidth - rect.width - 8);
      var maxT = Math.max(8, window.innerHeight - rect.height - 8);
      var left = Math.min(maxL, Math.max(8, rect.left));
      var top = Math.min(maxT, Math.max(8, rect.top));
      dock.style.left = left + "px";
      dock.style.top = top + "px";
      dock.style.right = "auto";
      dock.style.bottom = "auto";
      dock.style.transform = "none";
      try {
        localStorage.setItem(posKey, JSON.stringify({ left: left, top: top, collapsed: collapsed }));
      } catch (e) {}
    }

    try {
      var saved = JSON.parse(localStorage.getItem(posKey) || "null");
      if (saved && typeof saved.left === "number" && typeof saved.top === "number") {
        dock.style.left = saved.left + "px";
        dock.style.top = saved.top + "px";
        dock.style.transform = "none";
        collapsed = !!saved.collapsed;
        applyCollapsed();
        requestAnimationFrame(clampDock);
      }
    } catch (e) {}

    function onDragStart(e) {
      if (e.button != null && e.button !== 0) return;
      dragging = true;
      dragMoved = false;
      startX = e.clientX;
      startY = e.clientY;
      var rect = dock.getBoundingClientRect();
      origLeft = rect.left;
      origTop = rect.top;
      dock.style.transform = "none";
      try { handle.setPointerCapture(e.pointerId); } catch (err) {}
      e.preventDefault();
    }

    function onDragMove(e) {
      if (!dragging) return;
      var dx = e.clientX - startX;
      var dy = e.clientY - startY;
      // Threshold: little movement = click; otherwise drag
      if (Math.abs(dx) + Math.abs(dy) > 6) dragMoved = true;
      if (!dragMoved) return;
      dock.style.left = (origLeft + dx) + "px";
      dock.style.top = (origTop + dy) + "px";
      dock.style.right = "auto";
      dock.style.bottom = "auto";
    }

    function onDragEnd(e) {
      if (!dragging) return;
      dragging = false;
      try {
        if (handle.hasPointerCapture && handle.hasPointerCapture(e.pointerId)) {
          handle.releasePointerCapture(e.pointerId);
        }
      } catch (err) {}
      if (!dragMoved) {
        // Short click on ⋮⋮ → collapse / expand
        toggleCollapsed();
      } else {
        clampDock();
      }
      setTimeout(function () { dragMoved = false; }, 40);
    }

    handle.addEventListener("pointerdown", onDragStart);
    handle.addEventListener("pointermove", onDragMove);
    handle.addEventListener("pointerup", onDragEnd);
    handle.addEventListener("pointercancel", onDragEnd);
    handle.addEventListener("keydown", function (e) {
      if (e.key === "Enter" || e.key === " ") {
        e.preventDefault();
        toggleCollapsed();
      }
    });
    window.addEventListener("resize", clampDock);
    applyCollapsed();

    // Long-press tip on touch (title/tooltip substitute)
    var tipTimer = null;
    dock.addEventListener("pointerdown", function (e) {
      var t = e.target && e.target.closest ? e.target.closest("[title]") : null;
      if (!t || t === handle) return;
      var label = t.getAttribute("title");
      if (!label) return;
      clearTimeout(tipTimer);
      tipTimer = setTimeout(function () {
        setHint(label);
        setTimeout(function () { setHint(""); }, 1400);
      }, 420);
    }, true);
    dock.addEventListener("pointerup", function () { clearTimeout(tipTimer); }, true);
    dock.addEventListener("pointercancel", function () { clearTimeout(tipTimer); }, true);
    dock.addEventListener("pointermove", function (e) {
      if (e.pointerType === "touch") clearTimeout(tipTimer);
    }, true);
  }

  function bindUi() {
    els.tools.forEach(function (btn) {
      btn.addEventListener("click", function () { setTool(btn.getAttribute("data-tool")); });
    });
    if (els.btnWake) els.btnWake.addEventListener("click", toggleWake);
    if (els.btnRotate) els.btnRotate.addEventListener("click", rotateView);
    if (els.btnUndo) els.btnUndo.addEventListener("click", function () { annotations.undo(); redrawAnnotations(); });
    if (els.btnClear) els.btnClear.addEventListener("click", function () {
      if (window.confirm("Limpar todas as marcações desta conferência?")) {
        annotations.clear();
        redrawAnnotations();
      }
    });
    if (els.btnLibrary) els.btnLibrary.addEventListener("click", openLibrary);
    if (els.btnCloseLibrary) els.btnCloseLibrary.addEventListener("click", closeLibrary);
    if (els.libraryBody) {
      els.libraryBody.addEventListener("click", function (e) {
        var btn = e.target && e.target.closest ? e.target.closest("button[data-act]") : null;
        if (!btn) return;
        var row = btn.closest(".lib-item");
        if (!row) return;
        var id = row.getAttribute("data-id");
        var act = btn.getAttribute("data-act");
        if (act === "open") {
          setHint("Abrindo da biblioteca…");
          loadPdfFromLibrary(id).then(function (doc) {
            return openPdfBytes(doc.bytes, doc.name, { docId: id, skipLibrarySave: true });
          }).then(function () {
            closeLibrary();
          }).catch(function (err) {
            console.warn(err);
            setHint("Não foi possível reabrir este PDF.");
            setTimeout(function () { setHint(""); }, 2200);
          });
        } else if (act === "del") {
          if (!window.confirm("Remover este PDF da biblioteca? As marcações também serão apagadas.")) return;
          removeFromLibrary(id).then(function () {
            if (state.docId === id) {
              state.docId = "";
              state.pdfBytes = null;
            }
            renderLibraryList();
          });
        }
      });
    }
    els.btnExportHtml.addEventListener("click", exportHtml);
    els.btnExportText.addEventListener("click", copyText);
    els.btnShare.addEventListener("click", shareReport);
    els.btnTextCancel.addEventListener("click", closeNoteModal);
    els.btnTextOk.addEventListener("click", saveNote);
    if (els.btnDeleteCancel) els.btnDeleteCancel.addEventListener("click", closeDeleteAnnotationModal);
    if (els.btnDeleteConfirm) els.btnDeleteConfirm.addEventListener("click", confirmDeleteAnnotation);
    if (els.deleteModal) {
      els.deleteModal.addEventListener("click", function (ev) {
        if (ev.target === els.deleteModal) closeDeleteAnnotationModal();
      });
    }
    function onPickPdf(input) {
      var file = input.files && input.files[0];
      if (!file) return;
      importPdfFile(file);
      input.value = "";
    }
    els.fileInput.addEventListener("change", function () { onPickPdf(els.fileInput); });
    if (els.fileInputLibrary) {
      els.fileInputLibrary.addEventListener("change", function () { onPickPdf(els.fileInputLibrary); });
    }
    els.viewport.addEventListener("pointerdown", onPointerDown);
    els.viewport.addEventListener("pointermove", onPointerMove);
    els.viewport.addEventListener("pointerup", onPointerUp);
    els.viewport.addEventListener("pointercancel", onPointerUp);
    els.viewport.addEventListener("wheel", onWheel, { passive: false });
    window.addEventListener("resize", function () {
      clearTimeout(state.resizeTimer);
      state.resizeTimer = setTimeout(function () {
        if (!state.pageInfo || !state.pdf) return;
        // Soft keyboard / modal on Android fires resize — NEVER fit-to-page here.
        if (state.savedView) restoreView(state.savedView);
        else applySceneTransform();
        scheduleViewRefine(220);
      }, 120);
    });
    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", function () {
        clearTimeout(state.resizeTimer);
        state.resizeTimer = setTimeout(function () {
          if (!state.pageInfo) return;
          if (state.savedView) restoreView(state.savedView);
          else applySceneTransform();
        }, 80);
      });
    }
    bindFullscreenControls();
    bindSideMenu();
    bindFloatingDock();
  }

  function boot() {
    bindUi();
    setTool("pan");
    setWakeEnabled(true).then(updateWakeUi);
    setHint("Preparando leitor de PDF…");
    ensurePdfJs().then(function () {
      // Defer native FS permission prompts until after first interactive frame.
      setTimeout(function () { ensureNativeFs().catch(function () {}); }, 1500);
      var index = readLibraryIndex();
      if (index.pdfs && index.pdfs.length) {
        if (isNativeCapacitor()) {
          setHint("Biblioteca pronta. Abra um PDF (📄) ou 📚 Biblioteca.");
          return;
        }
        var first = index.pdfs[0];
        setHint("Reabrindo da biblioteca…");
        return loadPdfFromLibrary(first.id).then(function (doc) {
          return openPdfBytes(doc.bytes, doc.name || first.name, { docId: first.id, skipLibrarySave: true });
        }).catch(function () {
          setHint("Abra um PDF (📄 Abrir arquivos) ou use 📚 Biblioteca.");
        });
      }
      setHint("Abra um PDF (📄 Abrir arquivos) ou use 📚 Biblioteca.");
    }).catch(function (err) {
      console.error(err);
      setHint("PDF.js não carregou. Reinstale o app ou use o HTML com vendor/pdfjs.");
    });
  }

  boot();
})();
  </script>
</body>
