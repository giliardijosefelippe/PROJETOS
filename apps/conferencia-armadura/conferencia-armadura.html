<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1f24" />
  <meta name="description" content="Conferência de armadura — PdfViewer Prumo + marcações de campo." />
  <title>Conf. Armadura</title>
  <style>
    :root {
      --bg: #12161a; --surface: #1a1f24; --surface-2: #242b33; --border: #3a4550;
      --text: #f2f4f6; --muted: #a8b2bc; --accent: #e00024; --ok: #1f9d55; --risk: #e8a317;
      --safe-bottom: env(safe-area-inset-bottom, 0px); --safe-top: env(safe-area-inset-top, 0px);
      --top-h: 52px; --dock-size: 52px;
      font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; touch-action: none; }
    #app {
      display: grid;
      grid-template-rows: calc(var(--top-h) + var(--safe-top)) auto 1fr;
      height: 100%; height: 100dvh;
    }
    .top-bar {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: calc(6px + var(--safe-top)) 10px 6px;
      background: linear-gradient(180deg, #1c232b, #151a1f); border-bottom: 1px solid var(--border); z-index: 8;
    }
    .brand { display: flex; align-items: center; gap: 8px; min-width: 0; }
    .brand-mark { width: 26px; height: 26px; border-radius: 6px; background: linear-gradient(135deg, var(--accent), #8a0016); flex-shrink: 0; }
    .brand-text { display: flex; flex-direction: column; min-width: 0; }
    .brand-text strong { font-size: 14px; line-height: 1.1; }
    .brand-text span { font-size: 11px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 46vw; }
    .top-actions { display: flex; gap: 6px; align-items: center; }
    .chip, .icon-btn, .dock-btn, .primary, .secondary, .pdf-bar button, .pdf-bar input {
      border: 1px solid var(--border); background: var(--surface-2); color: var(--text); font-weight: 700; cursor: pointer;
    }
    .chip { min-height: 36px; padding: 0 10px; border-radius: 999px; font-size: 12px; color: var(--muted); }
    .chip.on { color: #102016; background: #7ddea8; border-color: #4caf78; }
    .chip.accent-chip { color: #fff; background: var(--accent); border-color: #ff3b57; }
    .icon-btn { width: 40px; height: 40px; border-radius: 10px; font-size: 18px; }

    #doc-toolbar {
      flex: 0 0 auto; display: flex; align-items: center; width: 100%;
      padding: 4px 8px; gap: 4px;
      background: linear-gradient(100deg, #1a2420, #12181a);
      border-bottom: 1px solid var(--border); overflow-x: auto; z-index: 7;
    }
    #doc-toolbar[hidden] { display: none !important; }
    .tools { display: flex; flex-wrap: nowrap; align-items: center; gap: 4px; min-height: 40px; }
    .tools button, .tools input[type="number"], .tools input[type="search"] {
      min-height: 34px; border-radius: 8px; padding: 0 8px; font-size: 13px;
    }
    .tools input[type="number"] { width: 52px; text-align: center; }
    .tools input[type="search"] { width: min(28vw, 140px); font-weight: 500; }
    .tool-divider { width: 1px; height: 22px; background: var(--border); margin: 0 4px; flex-shrink: 0; }
    #pdf-tools { display: flex; align-items: center; gap: 4px; flex-wrap: nowrap; }
    #zoom { min-width: 46px; text-align: center; font-size: 12px; color: var(--muted); }

    .stage { position: relative; overflow: hidden; min-height: 0; background: #0e1216; }
    #viewport { position: absolute; inset: 0; overflow: hidden; touch-action: none; }
    #pdf {
      position: absolute; inset: 0; contain: paint; touch-action: none; overflow: hidden; cursor: grab;
    }
    #pdf canvas {
      position: absolute; top: 0; left: 0; width: auto; height: auto;
      max-width: none; max-height: none; will-change: transform;
      transform-origin: 0 0; backface-visibility: hidden; pointer-events: none; user-select: none;
    }
    #anno-layer {
      position: absolute; left: 0; top: 0; transform-origin: 0 0;
      will-change: transform; pointer-events: none; z-index: 2;
    }
    #anno-layer.interactive { pointer-events: auto; cursor: crosshair; }
    #anno-canvas { display: block; width: 100%; height: 100%; }
    #select-preview {
      position: absolute; left: 0; top: 0; z-index: 3; pointer-events: none;
      border: 2px dashed #e00024; box-sizing: border-box; display: none;
      transform: translate3d(0,0,0); will-change: transform, width, height;
    }
    #select-preview.on { display: block; }
    #select-preview.ok { border-color: #1f9d55; }
    #select-preview.risk { border-color: #e00024; }

    .hint {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      background: rgba(18,22,26,.88); border: 1px solid var(--border); padding: 12px 16px;
      border-radius: 10px; color: var(--muted); font-size: 14px; pointer-events: none; z-index: 4;
      max-width: 82vw; text-align: center;
    }
    .hint[hidden] { display: none !important; }
    .autosave-chip {
      position: fixed; right: 12px; bottom: calc(12px + var(--safe-bottom)); z-index: 30;
      font-size: 11px; color: var(--muted); background: rgba(18,22,26,.82);
      border: 1px solid var(--border); border-radius: 999px; padding: 6px 10px;
      pointer-events: none; opacity: 0; transition: opacity .25s ease;
    }
    .autosave-chip.on { opacity: 1; }

    #tool-dock {
      position: fixed; z-index: 35; left: 10px; top: 50%; transform: translateY(-50%);
      width: calc(var(--dock-size) + 10px); max-height: calc(100dvh - var(--top-h) - 48px - var(--safe-bottom));
      display: flex; flex-direction: column; gap: 6px; padding: 6px; border-radius: 16px;
      background: rgba(21,26,31,.94); border: 1px solid var(--border);
      box-shadow: 0 10px 28px rgba(0,0,0,.45); touch-action: none; user-select: none;
    }
    #tool-dock.collapsed { width: var(--dock-size); }
    #tool-dock.collapsed .dock-body { display: none; }
    .dock-handle {
      display: flex; align-items: center; justify-content: center; min-height: 28px;
      border-radius: 10px; color: var(--muted); font-size: 14px; letter-spacing: .12em; cursor: grab;
      background: rgba(255,255,255,.04);
    }
    .dock-body { display: flex; flex-direction: column; gap: 6px; overflow: auto; }
    .dock-btn, .tool.dock-btn {
      width: var(--dock-size); height: var(--dock-size); border-radius: 14px;
      display: grid; place-items: center; font-size: 20px; padding: 0;
    }
    .tool[aria-pressed="true"] { background: #2c3640; border-color: #7f93a8; }
    .tool[data-tool="ok"][aria-pressed="true"] { background: #184a2d; border-color: var(--ok); }
    .tool[data-tool="risk"][aria-pressed="true"] { background: #4a1818; border-color: #ff4d4d; }
    .tool-icon.ok { color: #7ddea8; }
    .tool-icon.risk { color: #ff6b6b; font-weight: 900; }
    .dock-sep { height: 1px; background: var(--border); margin: 2px 8px; }
    .dock-btn.accent { background: var(--accent); border-color: #ff3b57; color: #fff; }
    .dock-btn.danger { color: #ffc9c9; border-color: #7a3030; }
    label.dock-btn { cursor: pointer; }

    .report-panel, .library-panel {
      position: fixed; left: 0; right: 0; bottom: 0; max-height: min(72vh, 640px);
      background: var(--surface); border-top: 1px solid var(--border); z-index: 40;
      display: flex; flex-direction: column; padding-bottom: var(--safe-bottom);
      box-shadow: 0 -12px 40px rgba(0,0,0,.45);
    }
    .report-panel[hidden], .library-panel[hidden] { display: none !important; }
    .report-head { display: flex; align-items: center; justify-content: space-between; padding: 12px 14px; border-bottom: 1px solid var(--border); }
    .report-head h2 { margin: 0; font-size: 18px; }
    .report-body { overflow: auto; padding: 12px 14px; font-size: 14px; line-height: 1.45; flex: 1; }
    .report-body .summary { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
    .report-body .stat { background: var(--surface-2); border: 1px solid var(--border); border-radius: 10px; padding: 10px; text-align: center; }
    .report-body .stat strong { display: block; font-size: 22px; }
    .report-body .stat span { color: var(--muted); font-size: 12px; }
    .report-body .stat.ok strong { color: #7ddea8; }
    .report-body .stat.risk strong { color: #ffcc66; }
    .report-body h3 { margin: 12px 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
    .report-body h4 { margin: 10px 0 4px; font-size: 13px; color: var(--muted); }
    .report-body ul { margin: 0; padding-left: 18px; }
    .report-actions { display: flex; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--border); flex-wrap: wrap; }
    .primary, .secondary { min-height: 42px; padding: 0 14px; border-radius: 12px; }
    .primary { background: var(--accent); border-color: #ff3b57; color: #fff; }
    .library-panel .lib-item { display: flex; gap: 10px; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--border); }
    .library-panel .lib-meta strong { display: block; word-break: break-word; }
    .library-panel .lib-meta span { color: var(--muted); font-size: 12px; }
    .library-panel .lib-actions { display: flex; gap: 6px; }
    .library-panel .lib-actions button { min-height: 40px; padding: 0 12px; border-radius: 10px; }

    .modal { position: fixed; inset: 0; background: rgba(0,0,0,.55); z-index: 50; display: grid; place-items: end center; padding: 16px; }
    .modal[hidden] { display: none !important; }
    .modal-card { width: min(520px, 100%); background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 14px; }
    .modal-card h3 { margin: 0 0 8px; }
    .modal-card textarea {
      width: 100%; min-height: 90px; border-radius: 10px; border: 1px solid var(--border);
      background: #0f1317; color: var(--text); padding: 12px; font-size: 16px; resize: vertical;
    }
    .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
    .group-empty { color: var(--muted); font-size: 13px; }
  </style>
</head>
<body>
  <div id="app">
    <header class="top-bar">
      <div class="brand">
        <div class="brand-mark" aria-hidden="true"></div>
        <div class="brand-text">
          <strong>Conf. Armadura</strong>
          <span id="doc-label">Nenhum PDF</span>
        </div>
      </div>
      <div class="top-actions">
        <button type="button" id="btn-wake" class="chip on" aria-pressed="true">Tela ligada</button>
        <button type="button" id="btn-report-top" class="chip accent-chip">Relatório</button>
      </div>
    </header>

    <div id="doc-toolbar" aria-label="Controles do documento">
      <div class="tools" id="viewer-tools">
        <div id="pdf-tools">
          <button type="button" id="pdf-prev" aria-label="Página anterior">‹</button>
          <input id="pdf-page" type="number" min="1" value="1" aria-label="Número da página" />
          <span id="pdf-total">/ 1</span>
          <button type="button" id="pdf-next" aria-label="Próxima página">›</button>
          <button type="button" id="pdf-rotate" title="Girar página">↻</button>
          <input id="pdf-query" type="search" placeholder="Buscar no PDF" aria-label="Texto para buscar" />
          <button type="button" id="pdf-search">Buscar</button>
          <button type="button" id="pdf-match-prev" title="Ocorrência anterior">↑</button>
          <button type="button" id="pdf-match" title="Próxima ocorrência">↓</button>
          <span id="pdf-results" role="status" aria-live="polite"></span>
        </div>
        <span class="tool-divider" aria-hidden="true"></span>
        <button type="button" id="minus" aria-label="Afastar" title="Afastar">−</button>
        <span id="zoom">—</span>
        <button type="button" id="plus" aria-label="Aproximar" title="Aproximar">＋</button>
        <button type="button" id="fit" aria-label="Ajustar à tela" title="Ajustar">⛶</button>
      </div>
    </div>

    <main class="stage">
      <section id="viewport" aria-label="Área de visualização">
        <div id="pdf">
          <canvas aria-label="Página PDF"></canvas>
          <div id="anno-layer">
            <canvas id="anno-canvas"></canvas>
            <div id="select-preview" aria-hidden="true"></div>
          </div>
        </div>
      </section>
      <div id="hint" class="hint">Carregando…</div>
    </main>
  </div>

  <div id="autosave-chip" class="autosave-chip">Autosalvo</div>

  <div id="tool-dock" aria-label="Ferramentas flutuantes">
    <div class="dock-handle" id="dock-handle" role="button" tabindex="0" title="Recolher · Arrastar">⋮⋮</div>
    <div class="dock-body" id="dock-body">
      <button type="button" class="tool dock-btn" data-tool="pan" aria-pressed="true" title="Mover"><span class="tool-icon">✥</span></button>
      <button type="button" class="tool dock-btn" data-tool="stroke" title="Riscar"><span class="tool-icon">╱</span></button>
      <button type="button" class="tool dock-btn" data-tool="ok" title="OK — arrastar sobre rótulo"><span class="tool-icon ok">✓</span></button>
      <button type="button" class="tool dock-btn" data-tool="risk" title="Não conforme"><span class="tool-icon risk">✕</span></button>
      <button type="button" class="tool dock-btn" data-tool="arrow" title="Seta"><span class="tool-icon">➜</span></button>
      <button type="button" class="tool dock-btn" data-tool="note" title="Nota"><span class="tool-icon">T</span></button>
      <div class="dock-sep"></div>
      <button type="button" id="btn-undo" class="dock-btn" title="Desfazer">↶</button>
      <button type="button" id="btn-clear" class="dock-btn danger" title="Limpar">⌫</button>
      <label class="dock-btn" title="Importar PDF">📄<input type="file" id="file-input" accept="application/pdf,.pdf" hidden /></label>
      <button type="button" id="btn-library" class="dock-btn" title="Biblioteca">📚</button>
      <button type="button" id="btn-demo" class="dock-btn" title="Demo">▣</button>
      <button type="button" id="btn-report" class="dock-btn accent" title="Relatório">☰</button>
    </div>
  </div>

  <aside id="report-panel" class="report-panel" hidden>
    <div class="report-head">
      <h2>Relatório</h2>
      <button type="button" id="btn-close-report" class="icon-btn">✕</button>
    </div>
    <div id="report-body" class="report-body"></div>
    <div class="report-actions">
      <button type="button" id="btn-export-html" class="primary">Exportar HTML</button>
      <button type="button" id="btn-export-text" class="secondary">Copiar texto</button>
      <button type="button" id="btn-share" class="secondary">Compartilhar</button>
    </div>
  </aside>

  <aside id="library-panel" class="library-panel" hidden>
    <div class="report-head">
      <h2>Biblioteca de PDFs</h2>
      <button type="button" id="btn-close-library" class="icon-btn">✕</button>
    </div>
    <div id="library-body" class="report-body"><p class="group-empty">Nenhum PDF importado.</p></div>
    <div class="report-actions">
      <label class="primary" style="display:inline-flex;align-items:center;justify-content:center;padding:0 14px;border-radius:12px;min-height:42px;cursor:pointer;">
        Importar PDF<input type="file" id="file-input-library" accept="application/pdf,.pdf" hidden />
      </label>
      <button type="button" id="btn-library-demo" class="secondary">Demo</button>
    </div>
  </aside>

  <div id="text-modal" class="modal" hidden>
    <div class="modal-card">
      <h3 id="text-modal-title">Nota no PDF</h3>
      <textarea id="text-input" rows="3" placeholder="Descreva o trecho ou o motivo…" maxlength="500"></textarea>
      <div class="modal-actions">
        <button type="button" id="btn-text-cancel" class="secondary">Cancelar</button>
        <button type="button" id="btn-text-ok" class="primary">Confirmar</button>
      </div>
    </div>
  </div>

  <script type="module" src="./conference-app.mjs"></script>
</body>
</html>
